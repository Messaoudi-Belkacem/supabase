# Extends docker-compose.yml to add the OTT CRM frontend container.
#
# IP-only mode (no domain/SSL):
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d
#
# With domain + Caddy (once you have a domain):
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml -f docker-compose.frontend-caddy.yml up -d

services:

  frontend:
    container_name: ott-frontend
    image: ghcr.io/${GHCR_IMAGE}:latest
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1"]
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s
